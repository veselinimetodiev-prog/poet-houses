<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
  <meta name="theme-color" content="#1f2a44">
  <title>Къщите на писателите</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 30 32 10l24 20v24H8z' fill='%23c8553d'/%3E%3Crect x='26' y='38' width='12' height='16' fill='%23fff8ec'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css">

<body>
  <header class="topbar">
    <button class="brand" id="brand" type="button">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 30 32 10l24 20v24H8z" fill="currentColor"/><rect x="26" y="38" width="12" height="16" fill="var(--bg)"/></svg>
      <span data-i18n="title">Къщите на писателите</span>
    </button>
    <div class="topbar-actions">
      <button class="chip" id="langBtn" type="button">EN</button>
      <button class="chip" id="signOutBtn" type="button" hidden data-i18n="sign_out">Изход</button>
    </div>
  </header>
  <main id="app"><p class="center muted" data-i18n="loading">Зареждане…</p></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
